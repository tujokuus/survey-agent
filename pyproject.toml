[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "survey-browser-agent"
version = "0.1.0"
description = "A read-only learning project for extracting structured news data with Browser Use and Ollama."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "browser-use>=0.12,<0.13",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
survey-browser-agent = "survey_browser_agent.cli:main"
news-read = "survey_browser_agent.cli:news_read_entry"

[tool.hatch.build.targets.wheel]
packages = ["src/survey_browser_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

